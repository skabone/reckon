<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reckon</title>
<meta name="description" content="Mental math, trained like a sport — a per-skill ladder with placement, level tests, lessons, and an honest coach.">
<meta name="app-build" content="2026-09-17">
<meta name="app-build-id" content="2026-09-17.4aae7df">
<meta name="theme-color" content="#F9F9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Reckon">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F9F9F6; --grid:rgba(46,91,255,.055); --surface:#FFFFFF; --surface2:#F1F2ED;
  --ink:#1D2534; --muted:#626B7E; --faint:#9AA1B0; --line:#E2E4DC; --line2:#CDD0C6;
  --accent:#2E5BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(46,91,255,.09);
  --amber:#B97708; --amber-soft:rgba(217,138,15,.13);
  --good:#1E8A5A; --good-soft:rgba(30,138,90,.11);
  --bad:#C2402F; --bad-soft:rgba(194,64,47,.10);
  --glow:rgba(46,91,255,.28);
  --shadow:0 1px 2px rgba(29,37,52,.06),0 8px 24px rgba(29,37,52,.07);
  --shadow-lift:0 2px 4px rgba(29,37,52,.08),0 14px 34px rgba(29,37,52,.13);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141D; --grid:rgba(124,149,255,.05); --surface:#171D2A; --surface2:#1D2433;
    --ink:#E7EAF3; --muted:#9AA3B8; --faint:#6B7488; --line:#252D3E; --line2:#323B4F;
    --accent:#7C95FF; --accent-ink:#0E1322; --accent-soft:rgba(124,149,255,.13);
    --amber:#E8AC4A; --amber-soft:rgba(232,172,74,.14);
    --good:#4CC38A; --good-soft:rgba(76,195,138,.13);
    --bad:#E5705C; --bad-soft:rgba(229,112,92,.13);
    --glow:rgba(124,149,255,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lift:0 2px 5px rgba(0,0,0,.4),0 16px 38px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#10141D; --grid:rgba(124,149,255,.05); --surface:#171D2A; --surface2:#1D2433;
  --ink:#E7EAF3; --muted:#9AA3B8; --faint:#6B7488; --line:#252D3E; --line2:#323B4F;
  --accent:#7C95FF; --accent-ink:#0E1322; --accent-soft:rgba(124,149,255,.13);
  --amber:#E8AC4A; --amber-soft:rgba(232,172,74,.14);
  --good:#4CC38A; --good-soft:rgba(76,195,138,.13);
  --bad:#E5705C; --bad-soft:rgba(229,112,92,.13);
  --glow:rgba(124,149,255,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 2px 5px rgba(0,0,0,.4),0 16px 38px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font:16px/1.55 "Instrument Sans",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.app{max-width:920px;margin:0 auto;padding:0 20px 80px}
/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px;padding:22px 0 14px;flex-wrap:wrap}
.wordmark{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:1px}
.wordmark .dot{color:var(--accent)}
.tagline{color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.chip.streak{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.rank{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 26px;position:sticky;top:10px;z-index:20;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:10px 8px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:not([aria-selected="true"]):hover{color:var(--ink)}
/* ---------- shared ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
h2.sec{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em;margin:30px 0 4px;text-wrap:balance}
p.sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:15px;transition:transform .06s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border:1px solid var(--line2);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.meter{height:7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.meter.amber>i{background:var(--amber)}
/* ---------- train: mode picker ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}
.mode{padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .1s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode .name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px}
.mode .desc{color:var(--muted);font-size:13.5px;line-height:1.45}
.mode .meta{margin-top:4px;font-size:12px;color:var(--accent);font-weight:600}
.mode.done{border-color:var(--good)}
.mode.done .meta{color:var(--good)}
.skillpick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.spill{padding:7px 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--muted);transition:all .12s}
.spill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* ---------- train: quiz ---------- */
.quiz{max-width:560px;margin:0 auto}
.quizbar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.quizbar .mono{font-weight:600}
.quizbar .lives{color:var(--bad);letter-spacing:2px;font-size:15px}
.quizbar .quit{margin-left:auto;color:var(--faint);font-weight:600}
.quizbar .quit:hover{color:var(--bad)}
.timerline{height:4px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:18px}
.timerline>i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.timerline>i.low{background:var(--bad)}
.problem-card{padding:34px 24px 26px;text-align:center;position:relative;overflow:hidden}
.problem-card .skilltag{position:absolute;top:12px;left:14px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.problem-card .lvltag{position:absolute;top:12px;right:14px;font-size:11px;font-weight:600;color:var(--accent)}
.problem{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(34px,7vw,52px);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;text-wrap:balance}
.problem .op{color:var(--accent)}
.hintline{min-height:22px;font-size:13.5px;color:var(--muted);margin-top:8px}
.answer{margin-top:14px;font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;min-height:52px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.answer .caret{display:inline-block;width:2px;height:34px;background:var(--accent);vertical-align:-6px;animation:blink 1.1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.answer.ok{color:var(--good)} .answer.no{color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:24px;font-size:14.5px;font-weight:600;margin-top:6px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:18px auto 0}
.pad button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 0;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;box-shadow:var(--shadow);transition:background .1s,transform .05s}
.pad button:hover{background:var(--surface2)}
.pad button:active{transform:scale(.96)}
.pad .go{background:var(--accent);color:var(--accent-ink);border-color:transparent;grid-row:span 2}
.pad .go:hover{background:var(--accent);filter:brightness(1.08)}
.kbdnote{text-align:center;color:var(--faint);font-size:12px;margin-top:12px}
/* ---------- results ---------- */
.results{max-width:560px;margin:0 auto;text-align:center;padding:30px 22px}
.results .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1.05}
.results .rsub{color:var(--muted);margin:4px 0 18px}
.rstats{display:flex;justify-content:center;gap:26px;margin:14px 0 6px;flex-wrap:wrap}
.rstat .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.rstat .k{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.lvlups{display:flex;flex-direction:column;gap:6px;margin:14px auto 4px;max-width:380px}
.lvlup{display:flex;align-items:center;gap:9px;font-size:14px;background:var(--good-soft);color:var(--good);border-radius:9px;padding:8px 13px;font-weight:600}
.lvlup.down{background:var(--bad-soft);color:var(--bad)}
.tipcard{margin:20px auto 0;max-width:430px;text-align:left;background:var(--amber-soft);border:none;border-radius:12px;padding:14px 16px}
.tipcard .eyebrow{color:var(--amber)}
.tipcard p{margin:5px 0 0;font-size:14.5px;line-height:1.5}
.ractions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
/* ---------- learn ---------- */
.belt{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lesson{padding:16px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,transform .1s}
.lesson:hover{border-color:var(--accent);transform:translateY(-2px)}
.lesson .band{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.lesson .band.b0{color:var(--good)}.lesson .band.b1{color:var(--accent)}.lesson .band.b2{color:var(--amber)}.lesson .band.b3{color:var(--bad)}
.lesson h3{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.lesson .gist{color:var(--muted);font-size:13.5px;line-height:1.45}
.lesson .mastered{font-size:12px;color:var(--good);font-weight:600}
.lessonview{max-width:620px;margin:0 auto}
.lessonview .card{padding:26px 26px 22px}
.lessonview h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:2px 0 10px;letter-spacing:-.015em;text-wrap:balance}
.lessonview .body p{margin:0 0 12px;font-size:15.5px;max-width:62ch}
.lessonview .body strong{font-weight:600}
.worked{background:var(--surface2);border-radius:11px;padding:15px 17px;margin:14px 0;font-size:15px}
.worked .eyebrow{margin-bottom:6px;display:block}
.worked .steps{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;line-height:1.9;font-size:14.5px;overflow-x:auto}
.worked .steps b{color:var(--accent);font-weight:600}
.backrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.backlink{color:var(--muted);font-weight:600;font-size:14px}
.backlink:hover{color:var(--accent)}
/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font-size:15px;color:var(--muted);font-weight:500}
.tile .k{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.skillrows{padding:18px}
.skillrow{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:12px;padding:8px 0}
.skillrow .nm{font-weight:600;font-size:14.5px}
.skillrow .lv{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.datacard{padding:18px}
.datacard h3{margin:20px 0 2px;font-size:15px;font-weight:600}
.datacard .note{font-size:13px;color:var(--muted);margin:0 0 8px}
.datacard textarea{width:100%;min-height:110px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;word-break:break-all}
.datacard textarea:focus{outline:none;border-color:var(--accent)}
.datawarn{font-size:14px;color:var(--ink);background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:8px;padding:10px 12px;margin:10px 0}
.snap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.snap .btn{padding:7px 14px;font-size:13.5px}
.buildnote{margin-top:16px!important}
.chartcard{padding:18px}
.chartcard h3{margin:0 0 2px;font-size:15px;font-weight:600}
.chartcard .note{font-size:12.5px;color:var(--faint);margin:0 0 12px}
.chartwrap{overflow-x:auto}
.recocard{padding:18px;border-left:3px solid var(--accent)}
.recocard h3{margin:0 0 4px;font-size:15px;font-weight:600}
.recocard p{margin:0;color:var(--muted);font-size:14px}
.recocard .btn{margin-top:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:15px}
svg text{font-family:"Instrument Sans",sans-serif}
svg .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .statgrid{grid-template-columns:1fr}
  .skillrow{grid-template-columns:110px 1fr 60px}
  .tabs{top:6px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
.hide{display:none !important}
/* ---------- coach ---------- */
.coachbanner{display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:8px;border-left:3px solid var(--accent);font-size:14.5px;flex-wrap:wrap}
.coachbanner div{flex:1;min-width:220px;color:var(--muted)}
.coachbanner strong{color:var(--ink)}
.fbnote{font-weight:500;font-size:13.5px;color:var(--muted);margin-top:5px;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.45}
.review{margin:18px 0 0}
.rrow{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:8px}
.rrow.miss{border-left:3px solid var(--bad)}
.rrow.slow{border-left:3px solid var(--amber)}
.rrow.good{opacity:.75}
.rline{display:flex;align-items:center;gap:10px;font-size:14px}
.rmark{width:18px;text-align:center;flex:none}
.rrow.good .rmark{color:var(--good)} .rrow.miss .rmark{color:var(--bad)} .rrow.slow .rmark{color:var(--amber)}
.rq{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rq .op{color:var(--accent)}
.ra{color:var(--muted)} .rrow.miss .ra{color:var(--bad);font-weight:600}
.rt{color:var(--faint);font-size:12.5px;flex:none}
.rnote{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted);line-height:1.5}
.rlearn{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.rlearn:hover{text-decoration:underline}
.placegrid{display:flex;flex-direction:column;gap:8px;max-width:460px;margin:16px auto 4px;text-align:left}
.prow{display:flex;align-items:center;gap:10px}
.prow .nm{width:110px;font-size:13.5px;font-weight:600;flex:none}
.prow .lv{font-size:12px;color:var(--muted);width:70px;text-align:right;flex:none}
.coachcard{padding:6px 18px}
.cnote{padding:13px 0;font-size:14.5px;line-height:1.55;max-width:68ch}
.cnote+.cnote{border-top:1px dashed var(--line)}
.plancard{padding:6px 10px;display:flex;flex-direction:column}
.planrow{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 8px;font-size:14.5px;font-weight:500;border-radius:9px;transition:background .12s}
.planrow:hover{background:var(--accent-soft)}
.planrow+.planrow{border-top:1px solid var(--line)}
.pnum{width:24px;height:24px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none}
.planrow .pgo{margin-left:auto;color:var(--accent);font-weight:600}
/* ---------- voice & visuals ---------- */
.chip.voice{cursor:pointer;color:var(--muted);background:var(--surface);transition:all .15s}
.chip.voice[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.voice svg{display:block}
.listen{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--muted);transition:all .12s}
.listen:hover{color:var(--accent);border-color:var(--accent)}
.listen.playing{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.vizwrap{margin:16px 0;padding:16px;background:var(--surface2);border-radius:11px}
.vizwrap .vcap{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
.vizwrap svg{display:block;max-width:100%;margin:0 auto}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:6px 0}
.flow .fc{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 13px}
.flow .fo{color:var(--accent);font-weight:600}
.flow .fa{color:var(--faint)}
/* ---------- choice questions ---------- */
.choices{display:flex;flex-direction:column;gap:9px;max-width:420px;margin:18px auto 0}
.choices.wide{flex-direction:row;justify-content:center}
.choices button{background:var(--surface);border:1.5px solid var(--line2);border-radius:11px;padding:13px 18px;font-size:15.5px;font-weight:600;text-align:center;transition:all .12s;box-shadow:var(--shadow)}
.choices.wide button{min-width:130px;font-size:17px}
.choices button:hover{border-color:var(--accent);color:var(--accent)}
.choices button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.choices button.wrongpick{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choices button.reveal{border-color:var(--good);color:var(--good)}
.choices button:disabled{cursor:default}
/* ---------- lesson player ---------- */
.player{max-width:620px;margin:0 auto}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line2);transition:all .2s}

<script>
'use strict';
/* ================= storage ================= */
// S.v stays 1 so an older cached build can still read the store; S.sv is the schema version migrations move.
const KEY='reckon.v1',SNAP_KEY='reckon.snaps',QUAR_KEY='reckon.quarantine',PREMIG_KEY='reckon.premigrate';
const BUILD='2026-09-17.4aae7df'; // ship.sh stamps date + content hash here
const STORE_SV=3,SNAP_MAX=5,QUAR_MAX=3;
const SKILL_IDS=['add','sub','mul','div','pct','sq','frac','est'];
const SKILLS={
  add:{name:'Addition'}, sub:{name:'Subtraction'}, mul:{name:'Multiplication'}, div:{name:'Division'},
  pct:{name:'Percentages'}, sq:{name:'Squares'}, frac:{name:'Fractions'}, est:{name:'Estimation'}
};
function freshState(tk){
  const sk={}; SKILL_IDS.forEach(id=>sk[id]={lv:1,xp:0});
  return {v:1,sv:STORE_SV,skills:sk,hist:[],agg:{},days:{},streak:{last:'',n:0},bestSprint:0,bestSurvival:0,
          daily:{},lessons:{},totals:{n:0,ok:0},sel:SKILL_IDS.slice(),lastCheck:'',
          units:{},tests:{},rhist:[],ladder:{},study:{},rq:[],profile:{name:'',age:'',occ:'',created:tk||todayKey()}};
}
// daily aggregates outlive the 1000-row history cap: per day n/ok/ms, per skill [n,ok], per mode n
function aggAdd(agg,day,h){
  const a=agg[day]||(agg[day]={n:0,ok:0,ms:0,s:{}});
  a.n++;a.ok+=h.ok?1:0;a.ms+=h.ms||0;
  const k=a.s[h.s]||(a.s[h.s]=[0,0]);k[0]++;k[1]+=h.ok?1:0;
  if(h.m){a.m=a.m||{};a.m[h.m]=(a.m[h.m]||0)+1;}
}
// Review queue: a missed problem comes back after 1, 3, 7, 16 and 35 days; a miss sends it back to the start and
// a right answer at the last step retires it. Pure in (rq, now) — due times are local midnights, so "tomorrow"
// means the next calendar day, not 24 hours on. Items are {s, lv, d, box, due, added, n}.
const RQ_STEPS=[1,3,7,16,35],RQ_MAX=200,RQ_ROUND=10;
const RQ_MODES=['practice','sprint','survival','daily','drill','unit','ltest']; // not check/assess: they probe above your level on purpose
function rqKey(s,d){return s+'|'+Object.keys(d).sort().map(k=>k+':'+d[k]).join(',');}
function dayAfter(now,n){const t=new Date(now);return new Date(t.getFullYear(),t.getMonth(),t.getDate()+n).getTime();}
function rqAdd(rq,it,now){
  const k=rqKey(it.s,it.d),due=dayAfter(now,RQ_STEPS[0]),at=rq.findIndex(x=>rqKey(x.s,x.d)===k);
  const out=rq.slice();
  if(at>=0)out[at]=Object.assign({},rq[at],{box:0,due});
  else out.push({s:it.s,lv:it.lv,d:Object.assign({},it.d),box:0,due,added:now,n:0});
  while(out.length>RQ_MAX){ // full: let go of the best-known item, oldest first
    let drop=0;out.forEach((x,i)=>{if(x.box>out[drop].box||(x.box===out[drop].box&&x.added<out[drop].added))drop=i;});
    out.splice(drop,1);
  }
  return out;
}
function rqDue(rq,now){return rq.filter(x=>x.due<=now).sort((a,b)=>a.due-b.due||a.box-b.box||a.added-b.added);}
function rqNextDue(rq){return rq.length?Math.min(...rq.map(x=>x.due)):null;}
function rqAnswer(rq,k,ok,now){
  return rq.map(x=>{
    if(rqKey(x.s,x.d)!==k)return x;
    const box=ok?x.box+1:0;
    return box>=RQ_STEPS.length?null:Object.assign({},x,{box,due:dayAfter(now,RQ_STEPS[box]),n:(x.n||0)+1,last:now});
  }).filter(Boolean);
}
// MIGRATIONS[n] takes schema n to n+1. Pure: each works on the copy migrate() hands it.
const MIGRATIONS=[
  (s,tk)=>{ // 0 → 1: what earlier builds patched in ad hoc after load
    s.lessons=s.lessons||{};
    Object.keys(s.lessons).forEach(k=>{if(s.lessons[k]===true)s.lessons[k]={c:1,m:1};});
    s.units=s.units||{};s.tests=s.tests||{};s.rhist=s.rhist||[];s.ladder=s.ladder||{};s.study=s.study||{};
    s.profile=s.profile||{name:'',age:'',occ:'',created:tk};
    return s;},
  s=>{ // 1 → 2: daily aggregates, backfilled from the history that survives
    s.agg={};(s.hist||[]).forEach(h=>aggAdd(s.agg,dayKey(new Date(h.t)),h));
    return s;},
  s=>{ // 2 → 3: review queue, seeded from the misses whose operands history still holds (only generated questions carry d)
    s.rq=[];
    (s.hist||[]).forEach(h=>{
      if(!h.ok&&h.d&&typeof h.d==='object'&&RQ_MODES.includes(h.m)&&SKILL_IDS.includes(h.s)&&Number.isInteger(h.lv)&&h.lv>=1&&h.lv<=12)
        s.rq=rqAdd(s.rq,{s:h.s,lv:h.lv,d:h.d},h.t);});
    return s;}
];
function migrate(s,tk){
  s=JSON.parse(JSON.stringify(s));
  for(let v=s.sv||0;v<STORE_SV;v++){s=MIGRATIONS[v](s,tk||todayKey());s.sv=v+1;}
  return s;
}
function validateState(s){
  const er=[],obj=x=>!!x&&typeof x==='object'&&!Array.isArray(x),num=x=>typeof x==='number'&&Number.isFinite(x);
  if(!obj(s))return ['not an object'];
  if(s.v!==1)er.push('v is not 1');

const VC={ac:'var(--accent)',acS:'var(--accent-soft)',am:'var(--amber)',ink:'var(--ink)',mut:'var(--muted)',ln:'var(--line2)',sf:'var(--surface)'};
function vSvg(W,H,inner){return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${inner}</svg>`;}
function vJumps(vals,labels,cap){
  const W=560,H=168,P=48,base=118;
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const x=v=>P+(v-lo)/(hi-lo||1)*(W-2*P);
  let s=`<line x1="${P-14}" y1="${base}" x2="${W-P+14}" y2="${base}" stroke="${VC.ln}" stroke-width="2"/>`;
  [...new Set(vals)].forEach(v=>{s+=`<line x1="${x(v)}" y1="${base-5}" x2="${x(v)}" y2="${base+5}" stroke="${VC.mut}" stroke-width="2"/>
    <text x="${x(v)}" y="${base+24}" text-anchor="middle" font-size="14" class="num" font-weight="600" fill="${VC.ink}">${fmt(v)}</text>`;});
  for(let i=0;i<vals.length-1;i++){
    const x1=x(vals[i]),x2=x(vals[i+1]),mid=(x1+x2)/2,peak=base-34-i*20;
    s+=`<path d="M ${x1} ${base-8} Q ${mid} ${peak} ${x2} ${base-8}" fill="none" stroke="${VC.ac}" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="${x2}" cy="${base-8}" r="3.5" fill="${VC.ac}"/>
        <text x="${mid}" y="${peak+2}" text-anchor="middle" font-size="14" class="num" font-weight="600" fill="${VC.ac}">${labels[i]}</text>`;
  }
  return vSvg(560,H,s)+(cap?`<div class="vcap">${cap}</div>`:'');
}
function vAreaMinus(h,wf,wc,lMain,lCut,cap){
  const W=560,RW=430,RH=110,X=(W-RW)/2,Y=14;
  const cw=Math.max(RW*wc/wf,52);
  let s=`<defs><pattern id="hat" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="${VC.am}" stroke-width="2"/></pattern></defs>
   <rect x="${X}" y="${Y}" width="${RW}" height="${RH}" rx="6" fill="${VC.acS}" stroke="${VC.ac}" stroke-width="2"/>
   <rect x="${X+RW-cw}" y="${Y}" width="${cw}" height="${RH}" rx="6" fill="url(#hat)" stroke="${VC.am}" stroke-width="2"/>
   <text x="${X+(RW-cw)/2}" y="${Y+RH/2+5}" text-anchor="middle" font-size="16" class="num" font-weight="600" fill="${VC.ink}">${lMain}</text>
   <text x="${X+RW-cw/2}" y="${Y+RH+22}" text-anchor="middle" font-size="13" class="num" font-weight="600" fill="${VC.am}">${lCut}</text>
   <text x="${X-10}" y="${Y+RH/2+5}" text-anchor="end" font-size="14" class="num" fill="${VC.mut}">${h}</text>`;
  return vSvg(W,RH+52,s)+`<div class="vcap">${cap}</div>`;
}
function vRectPair(w1,h1,w2,h2,l1,l2,midLbl,cap){
  const u=Math.min(200/Math.max(w1,w2),64/Math.max(h1,h2));
  const W=560,H=Math.max(h1,h2)*u+46;
  const r1w=w1*u,r1h=h1*u,r2w=w2*u,r2h=h2*u;
  const x1=40,x2=W-40-r2w,ymid=H-32;
  let s=`<rect x="${x1}" y="${ymid-r1h}" width="${r1w}" height="${r1h}" rx="6" fill="${VC.acS}" stroke="${VC.ac}" stroke-width="2"/>
   <text x="${x1+r1w/2}" y="${ymid-r1h/2+5}" text-anchor="middle" font-size="14" class="num" font-weight="600" fill="${VC.ink}">${l1}</text>
   <text x="${(x1+r1w+x2)/2}" y="${ymid-Math.max(r1h,r2h)/2+5}" text-anchor="middle" font-size="17" font-weight="600" fill="${VC.ac}">${midLbl}</text>
   <rect x="${x2}" y="${ymid-r2h}" width="${r2w}" height="${r2h}" rx="6" fill="${VC.acS}" stroke="${VC.ac}" stroke-width="2"/>

  return vSvg(W,H,s)+`<div class="vcap">${cap}</div>`;
}
function vSquareBinomial(a,b,cap){
  const side=190,X=90,Y=10,split=side*0.68;
  const cells=[[0,0,split,split,`${a}&#178; = ${fmt(a*a)}`,VC.acS],[split,0,side-split,split,`${fmt(a*b)}`,'var(--amber-soft)'],[0,split,split,side-split,`${a}&#215;${b} = ${fmt(a*b)}`,'var(--amber-soft)'],[split,split,side-split,side-split,`${fmt(b*b)}`,'var(--good-soft)']];

  s+=`<text x="${X+split/2}" y="${Y+side+20}" text-anchor="middle" font-size="13" class="num" fill="${VC.mut}">${a}</text>
      <text x="${X+split+(side-split)/2}" y="${Y+side+20}" text-anchor="middle" font-size="13" class="num" fill="${VC.mut}">${b}</text>
      <text x="${X-12}" y="${Y+split/2+4}" text-anchor="end" font-size="13" class="num" fill="${VC.mut}">${a}</text>
      <text x="${X-12}" y="${Y+split+(side-split)/2+4}" text-anchor="end" font-size="13" class="num" fill="${VC.mut}">${b}</text>`;
  return vSvg(400,side+34,s)+`<div class="vcap">${cap} <span style="color:var(--faint)">(regions not to scale)</span></div>`;
}
function vDiffSq(m,k,cap){
  const side=180,X=110,Y=12,kv=Math.max(side*k/m,40);
  let s=`<defs><pattern id="hat2" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="${VC.am}" stroke-width="2"/></pattern></defs>
   <rect x="${X}" y="${Y}" width="${side}" height="${side}" rx="6" fill="${VC.acS}" stroke="${VC.ac}" stroke-width="2"/>
   <rect x="${X+side-kv}" y="${Y+side-kv}" width="${kv}" height="${kv}" fill="url(#hat2)" stroke="${VC.am}" stroke-width="2"/>
   <text x="${X+side/2-kv/4}" y="${Y+side/2-kv/4+6}" text-anchor="middle" font-size="16" class="num" font-weight="600" fill="${VC.ink}">${m}&#178; = ${fmt(m*m)}</text>
   <text x="${X+side-kv/2}" y="${Y+side+20}" text-anchor="middle" font-size="12.5" class="num" font-weight="600" fill="${VC.am}">&#8722;${k}&#178; = ${k*k}</text>`;
  return vSvg(400,side+36,s)+`<div class="vcap">${cap}</div>`;
}
function vGrid(parts,cap){
  const cell=15,gap=2,X=170,Y=8;
  let cells='',idx=0;
  const cols=['var(--accent)','var(--amber)'];
  const total=parts.reduce((a,p)=>a+p.n,0);
  for(let i=0;i<100;i++){
    let fill='var(--surface)',stroke=VC.ln,run=0,f=null;
    for(const[pi,p]of parts.entries()){run+=p.n;if(i<run){f=cols[pi]||cols[0];break;}}
    if(f){fill=f;stroke=f;}
    const r=Math.floor(i/10),c=i%10;
    cells+=`<rect x="${X+c*(cell+gap)}" y="${Y+r*(cell+gap)}" width="${cell}" height="${cell}" rx="3" fill="${fill}" ${f?'':'fill-opacity="1"'} stroke="${stroke}" stroke-width="1" ${f?'':'opacity=".55"'}/>`;
  }
  return vSvg(560,Y+10*(cell+gap)+8,cells)+`<div class="vcap">${cap}</div>`;
}
function vFlow(items,cap){
  return `<div class="flow">${items.map((it,i)=>{
    const cls=/^[÷×+&−-]|✓|digit/.test(it)?'fc fo':'fc';
    return `<span class="${cls}">${it}</span>${i<items.length-1?'<span class="fa">&rarr;</span>':''}`;
  }).join('')}</div>`+(cap?`<div class="vcap">${cap}</div>`:'');
}
function vNear100(a,b,cap){
  const d1=100-a,d2=100-b,W=560;

   <line x1="215" y1="28" x2="345" y2="70" stroke="${VC.ac}" stroke-width="2"/>
   <line x1="215" y1="70" x2="345" y2="28" stroke="${VC.ac}" stroke-width="2"/>
   <line x1="150" y1="94" x2="410" y2="94" stroke="${VC.ln}" stroke-width="2"/>
   <text x="255" y="124" text-anchor="end" font-size="22" class="num" font-weight="600" fill="${VC.ac}">${a-d2}</text>
   <text x="268" y="124" text-anchor="middle" font-size="14" fill="${VC.mut}">|</text>
   <text x="282" y="124" text-anchor="start" font-size="22" class="num" font-weight="600" fill="${VC.am}">${String(d1*d2).padStart(2,'0')}</text>`;
  return vSvg(W,140,s)+`<div class="vcap">${cap}</div>`;

const LESSONS=[
 {id:'ltr-add',band:0,skill:'add',lv:2,title:'Left-to-right addition',gist:'Add the big columns first and refine — the way fast calculators actually add.',
  body:`<p>School teaches right-to-left with carrying, which forces you to remember digits backwards. Mentally, it is far easier to go <strong>left to right</strong>: handle the biggest value first, then fold in the rest.</p><p>Your running total is always a real, sayable number, so there is nothing to hold except one value.</p>`,
  worked:['47 + 38','40 + 30 = <b>70</b>','7 + 8 = <b>15</b>','70 + 15 = <b>85</b>']},
 {id:'complements',band:0,skill:'add',lv:3,title:'Complements to 10 and 100',gist:'Know instantly what each number needs to reach the next round number.',
  body:`<p>Every fast method leans on <strong>complements</strong>: 7 needs 3, 68 needs 32, 430 needs 570. For two-digit complements, the tens digits sum to 9 and the ones digits sum to 10.</p><p>Drill these until they are reflex — they turn awkward sums into round numbers.</p>`,
  worked:['68 + 57','68 needs <b>32</b> to reach 100','57 = 32 + 25','68 + 32 = 100, then + 25 = <b>125</b>']},
 {id:'add-up-sub',band:0,skill:'sub',lv:3,title:'Subtract by adding up',gist:'Turn subtraction into the addition you already do fast — count up from the smaller number.',
  body:`<p>Instead of borrowing, ask: <strong>how far is it</strong> from the smaller number to the bigger one? Jump to the next round number, then jump the rest. This is how cashiers count change.</p>`,
  worked:['83 &minus; 47','47 + <b>3</b> = 50','50 + <b>33</b> = 83','3 + 33 = <b>36</b>']},
 {id:'round-adjust',band:1,skill:'sub',lv:5,title:'Round, then adjust',gist:'Add or subtract a friendly round number, then correct the small error.',
  body:`<p>When a number is close to something round, use the round number and <strong>fix the difference</strong> afterwards. Subtracting 98? Subtract 100 and give 2 back.</p>`,
  worked:['624 &minus; 98','624 &minus; 100 = <b>524</b>','gave away 2 too many','524 + 2 = <b>526</b>']},
 {id:'times5',band:1,skill:'mul',lv:5,title:'&times;5, &times;25, &times;50',gist:'These are all ×10 or ×100 in disguise — multiply by the round number and divide.',
  body:`<p>5 is 10&divide;2, 25 is 100&divide;4, 50 is 100&divide;2. So <strong>×5 = ×10 then halve</strong>, ×25 = ×100 then quarter, ×50 = ×100 then halve. Dividing a round number is far easier than multiplying by 5 digit-by-digit.</p>`,
  worked:['86 &times; 5','86 &times; 10 = <b>860</b>','860 &divide; 2 = <b>430</b>','Also: 44 &times; 25 = 4400 &divide; 4 = <b>1100</b>']},
 {id:'times9-11',band:1,skill:'mul',lv:6,title:'&times;9 and &times;11',gist:'Nine is ten-minus-one; eleven has a famous digit trick.',
  body:`<p><strong>×9</strong>: multiply by 10 and subtract the number once. <strong>×11</strong> on a two-digit number: the answer is first digit, digit-sum, last digit — carry if the sum passes 9.</p>`,
  worked:['47 &times; 9 = 470 &minus; 47 = <b>423</b>','52 &times; 11 &rarr; 5, 5+2, 2 &rarr; <b>572</b>','78 &times; 11 &rarr; 7, 15, 8 &rarr; carry &rarr; <b>858</b>']},
 {id:'double-half',band:1,skill:'mul',lv:6,title:'Doubling and halving',gist:'Halve one factor, double the other, until the product is easy.',
  body:`<p>A product does not change if you <strong>halve one factor and double the other</strong>. Keep trading until one factor is trivial. Best when one factor is even — especially a power of 2.</p>`,
  worked:['16 &times; 35','8 &times; 70','4 &times; 140','2 &times; 280 = <b>560</b>']},
 {id:'distribute',band:1,skill:'mul',lv:7,title:'Break it apart',gist:'Split one factor into friendly pieces and multiply each — the workhorse of mental multiplication.',
  body:`<p>Multiplication distributes over addition: a×(b+c) = ab+ac. So split the harder factor into <strong>round + small</strong> (or round − small) and do two easy multiplications.</p>`,
  worked:['7 &times; 98','7 &times; 100 = <b>700</b>','7 &times; 2 = <b>14</b>','700 &minus; 14 = <b>686</b>']},
 {id:'pct-blocks',band:1,skill:'pct',lv:5,title:'Percents from 10% and 1%',gist:'Build any percent out of 10% and 1% blocks you can find instantly.',
  body:`<p>10% is one shift of the decimal point; 1% is two. <strong>Every percent is a combination</strong>: 15% = 10% + half of 10%. 35% = 3×10% + half of 10%. 6% = 5×1% + 1%.</p><p>And percents commute: 8% of 25 equals 25% of 8 — flip whenever the flip is easier.</p>`,
  worked:['15% of 240','10% &rarr; <b>24</b>','5% &rarr; <b>12</b>','24 + 12 = <b>36</b>']},
 {id:'sq-ends5',band:2,skill:'sq',lv:7,title:'Squares ending in 5',gist:'n5² is n×(n+1) with 25 stapled on the end. Instant.',
  body:`<p>For any number ending in 5: take the leading digits <strong>n</strong>, compute <strong>n×(n+1)</strong>, and append 25. Works because (10n+5)² = 100n(n+1)+25.</p>`,
  worked:['65&sup2;','6 &times; 7 = <b>42</b>','append 25','<b>4225</b>']},
 {id:'diff-squares',band:2,skill:'mul',lv:8,title:'Difference of squares',gist:'Numbers straddling a round middle multiply as middle² minus gap².',
  body:`<p>(m−k)(m+k) = m²−k². When two factors sit the <strong>same distance from a friendly middle</strong>, square the middle, subtract the square of the gap.</p>`,
  worked:['23 &times; 17','middle 20, gap 3','20&sup2; = 400, 3&sup2; = 9','400 &minus; 9 = <b>391</b>']},
 {id:'near100',band:2,skill:'mul',lv:9,title:'Multiplying near 100',gist:'For factors near 100, cross-subtract the deficits — the answer assembles itself.',
  body:`<p>Write each factor as 100 minus a small deficit. The answer's first part is either factor <strong>minus the other's deficit</strong>; the last two digits are the <strong>product of the deficits</strong>.</p>`,
  worked:['97 &times; 94','deficits 3 and 6','97 &minus; 6 = 94 &minus; 3 = <b>91</b>','3 &times; 6 = 18 &rarr; <b>9118</b>']},
 {id:'factor-div',band:2,skill:'div',lv:7,title:'Divide by factoring',gist:'Split an ugly divisor into easy chained divisions.',
  body:`<p>Dividing by 12 is dividing by 4 then 3 (or 2 then 6, or 6 then 2). <strong>Factor the divisor</strong> and divide in small steps, keeping the running value round where you can. To divide by 5: double, then shift the decimal.</p>`,
  worked:['432 &divide; 12','432 &divide; 4 = <b>108</b>','108 &divide; 3 = <b>36</b>','And 435 &divide; 5 = 870 &divide; 10 = <b>87</b>']},
 {id:'frac-pct',band:2,skill:'frac',lv:7,title:'Fraction &harr; percent fluency',gist:'A small conversion table you own cold covers almost every real case.',
  body:`<p>Own these cold: 1/8 = 12.5%, 1/5 = 20%, 1/4 = 25%, 3/8 = 37.5%, 2/5 = 40%, 5/8 = 62.5%, 3/4 = 75%, 7/8 = 87.5%. For twentieths, <strong>multiply the numerator by 5</strong>; for twenty-fifths, by 4.</p>`,
  worked:['7/20 as a percent','denominator 20 &rarr; &times;5 to reach 100','7 &times; 5 = <b>35</b>','<b>35%</b>']},
 {id:'divisibility',band:2,skill:'div',lv:8,title:'Divisibility rules',gist:'Know at a glance what divides a number — the gatekeeper for factoring tricks.',
  body:`<p><strong>2</strong>: last digit even. <strong>3</strong>: digit sum divisible by 3. <strong>4</strong>: last two digits. <strong>5</strong>: ends in 0 or 5. <strong>6</strong>: rules for 2 and 3 both. <strong>8</strong>: last three digits. <strong>9</strong>: digit sum divisible by 9. <strong>11</strong>: alternating digit sum divisible by 11.</p>`,
  worked:['Is 741 divisible by 3?','7+4+1 = <b>12</b>','12 = 3 &times; 4 &rarr; <b>yes</b>','741 = 3 &times; 247']},
/*ENGINE-ANCHOR*/
 {id:'estimation',band:3,skill:'est',lv:8,title:'Estimation with error control',gist:'Round in opposite directions so the errors cancel, and know your error bars.',
  body:`<p>Good estimation is not lazy math — it is <strong>error management</strong>. Round one factor up and the other down; the errors partly cancel. Track roughly how much you rounded to know which direction the true answer lies.</p>`,
  worked:['47 &times; 82','&asymp; 50 &times; 80 = <b>4000</b>','rounded up 3, down 2 &rarr; slightly low true error','true: 3854 — within 4%']},
 {id:'sq-near50-100',band:3,skill:'sq',lv:10,title:'Squares near 50 and 100',gist:'Two anchor formulas square most two-digit numbers in seconds.',
  body:`<p><strong>Near 50</strong>: (50±k)² = 2500 ± 100k + k². <strong>Near 100</strong>: (100−k)² = 10000 − 200k + k². The k² is tiny; the rest is a shift.</p>`,
  worked:['53&sup2; = 2500 + 300 + 9 = <b>2809</b>','47&sup2; = 2500 &minus; 300 + 9 = <b>2209</b>','97&sup2; = 10000 &minus; 600 + 9 = <b>9409</b>']},
 {id:'sq-any',band:3,skill:'sq',lv:11,title:'Square any two-digit number',gist:'Slide to the nearest round number, multiply, and add the slide squared.',
  body:`<p>n² = (n+k)(n−k) + k². <strong>Slide k</strong> to reach a round number one way, slide equally the other way, multiply the easy pair, then add k².</p>`,
  worked:['67&sup2;','slide 3: 70 &times; 64 = <b>4480</b>','add 3&sup2; = 9','<b>4489</b>']},
 {id:'cast9',band:3,skill:'add',lv:9,title:'Casting out nines',gist:'A 5-second checksum that catches most slips in any + − × result.',
  body:`<p>Reduce every number to its <strong>digit sum mod 9</strong>. Redo the operation on those small residues; the results must match. It will not catch swapped digits, but it catches most dropped carries.</p>`,
  worked:['347 + 189 = 536?','347 &rarr; 14 &rarr; 5; 189 &rarr; 18 &rarr; 0','5 + 0 = <b>5</b>','536 &rarr; 14 &rarr; <b>5</b> &check;']}
];
/* ================= concept content: why it works, checks, tries ================= */
const LESSON_EXTRA={
'ltr-add':{why:`<p>Addition is <strong>commutative and associative</strong> — you may regroup the pieces any way you like. 47+38 is really (40+7)+(30+8), and nothing stops you from adding (40+30) first.</p><p>Right-to-left with carrying was designed for <em>paper</em>, where digits sit still. In your head, digits vanish — so the winning order is the one where your running total is always a complete, sayable number.</p>`,
 checks:[
  {q:'Why does left-to-right beat right-to-left in your head?',opts:['It needs fewer addition steps','Your running total is always a real number you can say','It never produces a carry'],a:1,why:'Carries still happen — you just absorb them as you go. The win is that after every step you hold one honest number (70… 85), instead of loose digits and a carry flag.'},
  {q:'372 + 254: what is the strongest first move?',opts:['2 + 4 = 6','300 + 200 = 500','372 + 200 = 572'],a:2,why:'Either big-first move works, but folding the whole 200 into 372 (572) keeps ONE running total. Then 572+50=622, +4 = 626. Starting with 2+4 forces you to store digits backwards.'}],
 tries:[{t:'56 + 38',a:94},{t:'340 + 280',a:620}]},
'complements':{why:`<p>68+57 secretly contains a 100: addition lets you <strong>move quantity between the numbers</strong>. Slide 32 out of the 57 and into the 68 — the total can't change, but now it reads 100+25.</p><p>The pairs-to-100 pattern is mechanical: <strong>tens digits sum to 9, ones digits sum to 10</strong> (43↔57, 68↔32, 81↔19). Once these are reflex, round numbers appear everywhere.</p>`,
 checks:[
  {q:'What is the complement of 43 to 100?',opts:['57','67','53'],a:0,why:'Tens: 4+5=9. Ones: 3+7=10. So 57. Check: 43+57=100.'},
  {q:'What do complements actually buy you?',opts:['They replace multiplication','They turn messy sums into round numbers','They only help with subtraction'],a:1,why:'They are a currency converter: 68+57 becomes 100+25. And they power subtraction too — change from a 100 IS the complement.'}],
 tries:[{t:'complement of 68 to 100',a:32},{t:'75 + 49',a:124}]},
'add-up-sub':{why:`<p>Subtraction is the <strong>inverse of addition</strong>: 83−47 asks "what fills the gap from 47 up to 83?" A gap is a distance — and distances can be walked in easy stages.</p><p>Stage the walk through round numbers (47→50→83) and each hop is trivial. The borrowing algorithm answers the same question, but makes you demolish 83 digit by digit while you do it.</p>`,
 checks:[
  {q:'83 − 47 is really asking…',opts:['What is left of 83 after removing 4, then 7?','How far is it from 47 up to 83?','What is 83 minus 40, minus 7, minus carry?'],a:1,why:'All three compute the same number, but the distance framing is the one that needs no borrowing — you just walk 47→50→83 and add the hops: 3+33=36.'},
  {q:'Counting up from 47, what is the best first hop?',opts:['+33 straight away','+3 to reach 50','+40 to reach 87'],a:1,why:'+3 lands on a round number, and from 50 the rest (+33) is read off instantly. Overshooting to 87 forces a correction — extra work.'}],
 tries:[{t:'62 &minus; 38',a:24},{t:'400 &minus; 167',a:233}]},
'round-adjust':{why:`<p>If b is nearly round — say b = r−k — then <strong>a − b = a − r + k</strong>. Subtract the round r (easy), then pay back the k you over-subtracted.</p><p>Works for addition too: adding 199 is adding 200, minus 1. You trade one ugly operation for one easy operation plus one tiny correction.</p>`,
 checks:[
  {q:'523 − 98: you subtract 100 first. Then what?',opts:['Add 2 back','Subtract 2 more','Add 98'],a:0,why:'You took away 2 too many (100 instead of 98), so give 2 back: 423+2=425. The correction always goes OPPOSITE to your rounding.'},
  {q:'Which problem is begging for round-and-adjust?',opts:['356 − 123','356 − 199','88 − 44'],a:1,why:'199 is one step from 200: 356−200=156, +1=157. The other two have no nearby round number doing them any favors.'}],
 tries:[{t:'745 &minus; 298',a:447},{t:'312 + 199',a:511}]},
'times5':{why:`<p>5 is <strong>10÷2</strong>. So a×5 = a×10÷2 — and both of those are single effortless moves. Same logic: 25 = 100÷4 and 50 = 100÷2.</p><p>This is a general principle: multiplying by an awkward number is often multiplying by a round number, then dividing by a small one. The round number does the heavy lifting.</p>`,
 checks:[
  {q:'48 × 25 — the cleanest route?',opts:['48×20 + 48×5','4,800 ÷ 4','25 × 50 − 25 × 2'],a:1,why:'25 is a quarter of 100: 48×100=4,800, ÷4=1,200. The distributive route works but takes three ops; this takes two, both trivial.'},
  {q:'Why is ×10-then-halve easier than ×5 directly?',opts:['Because ×10 and ÷2 are each single mental moves','Because 5 is a prime number','Because halving is the same as ×5'],a:0,why:'×10 appends a zero; halving is one pass. Direct ×5 digit-by-digit makes you carry — two clean ops beat one messy one.'}],
 tries:[{t:'74 &times; 5',a:370},{t:'36 &times; 25',a:900}]},
'times9-11':{why:`<p>9 = 10−1 and 11 = 10+1, so a×9 = <strong>10a − a</strong> and a×11 = <strong>10a + a</strong>. That's the whole trick.</p><p>The ×11 digit pattern (5_2 → 5,7,2) is just 10a+a written out: 520+52 stacks the tens digit onto the ones digit of the shifted number — which is why the middle digit is the digit sum, and why a sum over 9 sends a carry left.</p>`,
 checks:[
  {q:'62 × 11 = 682. Where does the 8 come from?',opts:['6 × 2','6 + 2','11 − 3'],a:1,why:'620+62: the 2 of 620 meets the 6 of 62 in the tens column — 6+2=8. The pattern IS the addition, just viewed digit-wise.'},
  {q:'87 × 9 — which is right?',opts:['870 − 9','870 − 87','810 − 87'],a:1,why:'Nine 87s = ten 87s minus ONE 87: 870−87=783. Subtracting 9 instead of 87 is the classic slip — you must remove a whole copy of the number.'}],
 tries:[{t:'46 &times; 9',a:414},{t:'35 &times; 11',a:385}]},
'double-half':{why:`<p>a×b = (a÷2)×(b×2): a factor of 2 <strong>moves between the numbers</strong> without changing the product. Geometrically, you're reshaping a rectangle — half as tall, twice as wide, same area.</p><p>Keep trading until one factor is trivial. Best entry point: one factor even (especially a power of 2), the other ending in 5 — halving the even one and doubling the ...5 creates a round number.</p>`,
 checks:[
  {q:'When does doubling-and-halving shine brightest?',opts:['Both factors odd','One factor is a power of 2, the other ends in 5','Both factors are prime'],a:1,why:'16×35 → 8×70 → 4×140 → 2×280 → 560: the power of 2 melts away while the ...5 turns round immediately. Two odd factors give halving no entry point at all.'},
  {q:'14 × 45 — one trade of the factor 2 gives…',opts:['7 × 90','28 × 90','7 × 45'],a:0,why:'Halve 14 AND double 45 — the 2 must move, not vanish: 7×90=630. Options that only halve (7×45) or only double (28×90) change the answer.'}],
 tries:[{t:'18 &times; 35',a:630},{t:'24 &times; 15',a:360}]},
'distribute':{why:`<p>a×(b+c) = ab+ac isn't a school rule — it's what multiplication <strong>means</strong>. 7×98 is 7 rows of 98; chop each row into 100−2 and you have 7 rows of 100 minus 7 rows of 2.</p><p>Every big multiplication trick is distribution wearing a costume: ×9, ×11, near-100 — all of them split a factor into round + small. Master the split and you can invent your own shortcuts on the fly.</p>`,
 checks:[
  {q:'6 × 97 — the smart split?',opts:['6 × (100 − 3)','6 × (90 + 7)','(3 + 3) × 97'],a:0,why:'600−18=582: two trivial pieces. The 90+7 split works but 6×90=540 then +42 is heavier than one clean subtraction from 600. Always split toward the nearest ROUND number.'},
  {q:'Why does a×(b−c) = ab − ac?',opts:['It is a memorized rule','b−c rows of a is b rows minus c rows','Because subtraction distributes over division'],a:1,why:'Picture the rectangle: a wide, b−c tall is the full a×b block with an a×c strip sliced off. The algebra just writes down the picture.'}],
 tries:[{t:'8 &times; 97',a:776},{t:'43 &times; 21',a:903}]},
'pct-blocks':{why:`<p>"Percent" = "per hundred": p% of b is <strong>p×b÷100</strong>, nothing more. That single formula explains both tricks in this lesson.</p><p>First: any percent decomposes into 10% blocks (÷10) and 1% blocks (÷100) — so 35% = 3 tens + half a ten. Second: since p×b÷100 = b×p÷100, <strong>p% of b always equals b% of p</strong>. 8% of 25 feels hard; 25% of 8 is a quarter of 8. Same number.</p>`,
 checks:[
  {q:'Why does 8% of 25 equal 25% of 8?',opts:['Both round to the same value','Both are 8×25÷100 — multiplication commutes','It only works for numbers under 100'],a:1,why:'p% of b and b% of p are literally the same expression, 8×25÷100 = 2. Flip whenever the flipped version is friendlier — it always is when one number is 25 or 50.'},
  {q:'Build 35% from blocks:',opts:['3 × 10% + half of 10%','35 × 10%','3 × 10% + 5'],a:0,why:'Three 10% blocks plus a 5% block (half of 10%). Of 240: 24+24+24+12 = 84. The "+5" option adds a naked 5 — units matter; blocks are percents OF the base.'}],
 tries:[{t:'15% of 80',a:12},{t:'4% of 75',a:3}]},
'sq-ends5':{why:`<p>Write the number as 10n+5. Then (10n+5)² = 100n² + 2·(10n·5) + 25 = 100n² + 100n + 25 = <strong>100·n(n+1) + 25</strong>.</p><p>The ×100 shoves n(n+1) two places left, and the +25 fills the empty places — which is why the answer is literally n(n+1) with "25" glued on. The trick isn't magic; it's the binomial square with the cross-terms pre-collected.</p>`,
 checks:[
  {q:'85² — walk the shortcut:',opts:['8×8=64 → 6425','8×9=72 → 7225','85×80 + 25'],a:1,why:'n=8, so n(n+1)=8×9=72, append 25: 7,225. Using n×n misses the +100n cross-term — that is exactly what the (n+1) supplies.'},
  {q:'Why "append 25", always?',opts:['5² = 25 and every cross-term is a multiple of 100','It only works below 100','Because 25 is a quarter of 100'],a:0,why:'The last two digits can only come from 5²=25, since 100n² and 100n both end in 00. That is why the pattern never breaks — 15² to 995², same tail.'}],
 tries:[{t:'45<sup style="font-size:.6em">2</sup>',a:2025},{t:'95<sup style="font-size:.6em">2</sup>',a:9025}]},
'diff-squares':{why:`<p>(m−k)(m+k) = m² + mk − mk − k² = <strong>m² − k²</strong>: the cross-terms annihilate each other. That cancellation is the entire trick.</p><p>So whenever two factors straddle a round middle at equal distance, refuse to multiply them. Square the friendly middle, subtract the tiny gap squared. 23×17 = 20²−3². The harder the factors look, the more satisfying the collapse.</p>`,
 checks:[
  {q:'26 × 34 via the middle:',opts:['30² − 4² = 884','30² − 8² = 836','26² − 34²'],a:0,why:'Middle 30, gap 4 (each factor is 4 away): 900−16=884. The gap is the distance from the MIDDLE to each factor, not the distance between the factors (8).'},
  {q:'Which product is set up perfectly for this trick?',opts:['38 × 45','38 × 42','38 × 39'],a:1,why:'38 and 42 straddle 40 at gap 2: 1600−4=1596. The others have no round midpoint — their middles are 41.5 and 38.5, which defeats the purpose.'}],
 tries:[{t:'19 &times; 21',a:399},{t:'45 &times; 35',a:1575}]},
'near100':{why:`<p>Let the deficits be x=100−a and y=100−b. Then ab = (100−x)(100−y) = 10000 − 100x − 100y + xy = <strong>100·(100−x−y) + xy</strong>.</p><p>100−x−y is what cross-subtraction computes — and note a−y = (100−x)−y = 100−x−y = b−x, which is why subtracting EITHER deficit from the OTHER number gives the same front. The deficits' product xy fills the last two digits.</p>`,
 checks:[
  {q:'96 × 93 — assemble it:',opts:['96−7=89, 4×7=28 → 8,928','96−4=92, 93−7=86 → 9,286','96+93 → 189 → 18,900 − something'],a:0,why:'Deficits 4 and 7. Cross-subtract: 96−7 = 93−4 = 89. Deficit product 28 fills the tail: 8,928. Subtracting each number\'s OWN deficit (option 2) just rebuilds the originals.'},
  {q:'Why do both cross-subtractions give the same number?',opts:['Coincidence that usually holds','Both equal 100 − x − y','Because a and b are equal'],a:1,why:'a−y = (100−x)−y and b−x = (100−y)−x — both are 100−x−y. The symmetry is baked into the algebra, which is why you can pick whichever subtraction feels easier.'}],
 tries:[{t:'98 &times; 97',a:9506},{t:'95 &times; 96',a:9120}]},
'factor-div':{why:`<p>(a ÷ b) ÷ c = a ÷ (b×c): dividing in stages is the same as dividing once by the product. So ÷12 may be ÷4 then ÷3 — <strong>two table-sized divisions</strong> instead of one long one.</p><p>The ÷5 double-trick is the same idea inverted: a÷5 = 2a÷10, because multiplying top and bottom by 2 leaves the quotient alone and 10 is the easiest divisor there is.</p>`,
 checks:[
  {q:'÷18 in easy stages:',opts:['÷9 then ÷9','÷2 then ÷9','÷10 then ÷8'],a:1,why:'18 = 2×9, so halve, then ÷9. Option one divides by 81; option three by 80 — stages must MULTIPLY to the divisor, not add.'},
  {q:'Why does the double-then-÷10 trick work for ÷5?',opts:['2a÷10 = a÷5 — scaling top and bottom by 2','Because 5 is half of 10','Doubling always makes division easier'],a:0,why:'Multiply numerator and denominator by the same 2: a/5 = 2a/10. The quotient is untouched, but now the division is just a decimal shift: 435÷5 → 870÷10 → 87.'}],
 tries:[{t:'288 &divide; 16',a:18},{t:'615 &divide; 5',a:123}]},
'frac-pct':{why:`<p>A fraction IS a division, and a percent is that division <strong>scaled to a denominator of 100</strong>. So n/d as a percent is n×(100/d) — whenever 100/d is clean, the conversion is one multiply.</p><p>That's why the fluent denominators are 2, 4, 5, 8, 10, 20, 25, 50: their 100/d values (50, 25, 20, 12.5, 10, 5, 4, 2) are tiny multipliers you already know.</p>`,
 checks:[
  {q:'Why is 3/8 exactly 37.5%?',opts:['100 ÷ 8 = 12.5, and 3 × 12.5 = 37.5','3.75 × 10 = 37.5','It is close to 40% and rounds down'],a:0,why:'Each eighth is worth 12.5 hundredths. Three of them: 37.5. Exact, not a rounding — eighths always end in .5 percent when the numerator is odd.'},
  {q:'Denominator 20 — what is the instant multiplier?',opts:['×4','×5','×20'],a:1,why:'100÷20 = 5, so every twentieth is 5%: 9/20 = 45%. (For 25ths the multiplier is 4; for 50ths it is 2.)'}],
 tries:[{t:'11/25 as a percent',a:44},{t:'3/5 of 45',a:27}]},
'divisibility':{why:`<p>10 leaves remainder 1 when divided by 3 or by 9 — so 10ⁿ does too. That means 741 = 7·100+4·10+1 has the <strong>same remainder as 7+4+1</strong>: powers of ten collapse to 1s. Digit sums preserve divisibility by 3 and 9.</p><p>For 4 and 8 the logic flips: 100 is divisible by 4 and 1000 by 8, so everything above the last two (or three) digits is guaranteed clean — only the tail can break it.</p>`,
 checks:[
  {q:'Is 8,532 divisible by 4? Where do you look?',opts:['The digit sum (18)','Just "32"','The first two digits'],a:1,why:'8,500 is 85×100 and 100 is a multiple of 4 — that part can\'t fail. Only the tail matters: 32÷4=8, so yes. Digit sums are the tool for 3 and 9, not 4.'},
  {q:'Why does the digit sum test work for 9?',opts:['Every power of 10 leaves remainder 1 when divided by 9','Because 9 is one less than 10','Digits below 9 cannot affect remainders'],a:0,why:'10≡1, 100≡1, 1000≡1 (mod 9), so d·10ⁿ ≡ d. The whole number collapses to its digit sum, remainders intact. "9 is one less than 10" is the reason BEHIND that — but the working fact is the remainder-1 collapse.'}],
 tries:[{t:'digit sum of 8,451',a:18},{t:'774 &divide; 9',a:86}]},
'estimation':{why:`<p>In multiplication, small <strong>relative</strong> errors add: round one factor up 3% and the other down 2%, and the product is off by roughly 1%. That's why opposite-direction rounding is the professional habit — the errors fight each other.</p><p>Rounding both the same way stacks the errors instead: 47×82 → 50×90 inflates by ~17%. And tracking WHICH way you rounded tells you whether the truth sits above or below your estimate — an error bar for free.</p>`,
 checks:[
  {q:'47 × 82 — the sharper estimate?',opts:['50 × 90 = 4,500','50 × 80 = 4,000','40 × 80 = 3,200'],a:1,why:'50 is up ~6%, 80 is down ~2.4%: net ~+3.5% high — 4,000 vs the true 3,854. Both-up (4,500) stacks to +17%; both-down undershoots badly.'},
  {q:'You rounded both factors UP. Your estimate is…',opts:['An overestimate','An underestimate','Unbiased'],a:0,why:'Both errors push the product the same direction. Knowing the bias is half the value of estimating — you can say "under 4,500, probably well under."'}],
 tries:[{t:'&asymp; 61 &times; 79',a:4819,tol:.1},{t:'&asymp; 52 &times; 88',a:4576,tol:.1}]},
'sq-near50-100':{why:`<p>Both anchors are the binomial square with a round a. Near 50: (50±k)² = 2500 ± 2·50k + k² = <strong>2500 ± 100k + k²</strong> — the cross-term 2·50k conveniently becomes a clean hundred-multiple.</p><p>Near 100: (100−k)² = 10000 − 200k + k². The anchors work because squaring the round part and the cross-term are both effortless — only the tiny k² needs thought.</p>`,
 checks:[
  {q:'47² from the 50-anchor:',opts:['2500 − 300 + 9','2500 + 300 + 9','2500 − 3² '],a:0,why:'k=3 below 50: 2500 − 100·3 + 9 = 2,209. Forgetting the +k² (option 3) is the classic slip — the correction squares the slide, it never disappears.'},
  {q:'Where does the "100k" in the near-50 formula come from?',opts:['From k² rounded up','From the cross-term 2 × 50 × k','From 100 − k'],a:1,why:'The binomial square (a+b)² = a²+2ab+b² with a=50: the middle term 2·50·k = 100k. The anchor is chosen precisely so the cross-term lands on a round hundred.'}],
 tries:[{t:'48<sup style="font-size:.6em">2</sup>',a:2304},{t:'103<sup style="font-size:.6em">2</sup>',a:10609}]},
'sq-any':{why:`<p>Rearrange difference-of-squares: n² = (n+k)(n−k) + k². Slide k up AND k down — the product of the slid pair misses the true square by exactly k², so <strong>pay the k² back</strong>.</p><p>Choose k as the distance to the nearest multiple of 10, and (n+k)(n−k) becomes a round-number multiplication. Combined with the ends-in-5 and near-anchor shortcuts, this closes the map: every two-digit square is now two easy steps.</p>`,
 checks:[
  {q:'73² — set up the slide:',opts:['70 × 76 + 9','70 × 76 − 9','73 × 70 + 3'],a:0,why:'k=3: (73−3)(73+3) = 70×76 = 5,320, then ADD k²=9 → 5,329. The product undershoots the square (it\'s a difference of squares), so the correction is always added.'},
  {q:'How should you pick k?',opts:['Always k = 5','So that n ± k hits a round number','As large as possible'],a:1,why:'The slide exists to make the multiplication easy: 67 slides 3 to reach 70 (and 64). A big k for its own sake just moves the difficulty into k².'}],
 tries:[{t:'62<sup style="font-size:.6em">2</sup>',a:3844},{t:'89<sup style="font-size:.6em">2</sup>',a:7921}]},
'cast9':{why:`<p>Because every power of 10 leaves remainder 1 when divided by 9, a number and its digit sum leave the <strong>same remainder mod 9</strong>. And remainders respect arithmetic: the remainder of a sum is the sum of remainders (mod 9), same for products.</p><p>So redo the whole calculation on single-digit residues — a five-second shadow computation. If the shadows disagree, the original is definitely wrong. If they agree, you're <em>probably</em> right: it misses errors that keep the digit sum, like swapping two digits.</p>`,
 checks:[
  {q:'What kind of slip does casting out nines MISS?',opts:['A dropped carry','Two digits swapped (536 vs 563)','Being off by exactly 1'],a:1,why:'Swapped digits keep the same digit sum, so the check still balances. Dropped carries and off-by-ones change the residue and get caught — which is most real mistakes.'},
  {q:'Residue of 478 (mod 9)?',opts:['1','19','10'],a:0,why:'4+7+8 = 19 → 1+9 = 10 → 1+0 = 1. Keep collapsing until one digit; 9 itself counts as 0.'}],
 tries:[{t:'digit-sum residue of 583',a:7},{t:'digit-sum residue of 2,687',a:5}]}
};
LESSONS.forEach(l=>Object.assign(l,LESSON_EXTRA[l.id]||{}));
/* ================= vocabulary: every lesson teaches its words, in the register of the grade that learns it.
   Band 0 speaks to a grade-schooler, band 3 to a high-schooler. These feed the Words card, unit tests, and level tests. ================= */
const LESSON_VOCAB={
'ltr-add':[
 {t:'sum',d:'The answer you get when you add numbers together. In 47 + 38 = 85, the sum is 85.'},
 {t:'place value',d:'What a digit is worth because of where it sits. In 47, the 4 is not four — it is four TENS, worth 40. Left-to-right addition works because you add the big place values first.'},
 {t:'commutative property',d:'A fancy name for a simple fact: you can add numbers in any order and the answer does not change. 3 + 5 and 5 + 3 both make 8. "Commute" means to move around — the numbers may trade places.'},
 {t:'associative property',d:'When you add three or more numbers, you may group them any way you like. (2 + 8) + 5 and 2 + (8 + 5) both make 15 — so group the friendly pair first.'}],
'complements':[
 {t:'complement',d:'The number that fills another number up to a round target. 68 needs 32 to reach 100, so 32 is the complement of 68.'},
 {t:'round number',d:'A number that ends in zero, like 10, 50, or 100. Round numbers are easy to add and subtract with — that is why every trick aims at them.'},
 {t:'digit',d:'One of the ten symbols 0 through 9 that numbers are written with. In 68, the digits are 6 and 8 — and complement pairs work digit by digit: tens add to 9, ones add to 10.'}],
'add-up-sub':[
 {t:'difference',d:'The answer to a subtraction — how far apart two numbers are. The difference between 83 and 47 is 36.'},
 {t:'inverse operations',d:'Operations that undo each other. Subtraction undoes addition — which is why you can answer 83 − 47 by asking "what do I ADD to 47 to reach 83?"'},
 {t:'number line',d:'A picture of the numbers laid out on a line. Counting up from 47 to 83 is walking that line in easy hops: +3 to 50, then +33.'}],
'round-adjust':[
 {t:'rounding',d:'Nudging a number to the nearest friendly one — 98 rounds to 100. Here you round to make the arithmetic easy, then fix the small difference, so the final answer is still exact.'},
 {t:'compensate',d:'To pay back what your rounding changed. Subtract 100 instead of 98 and you took 2 too many — so compensate: give 2 back. The correction always goes opposite to the rounding.'},
 {t:'estimate vs. exact',d:'An estimate is deliberately close; exact is the true answer. Round-and-adjust produces an EXACT answer — the rounding is temporary and always repaid.'}],
'times5':[
 {t:'factor',d:'A number being multiplied. In 86 × 5, both 86 and 5 are factors.'},
 {t:'product',d:'The answer of a multiplication. The product of 86 and 5 is 430.'},
 {t:'halving',d:'Dividing by 2. It is the partner move to ×10 in this trick: ×5 equals ×10 then halve, because 5 is half of 10. Same idea: ×25 is ×100 then quarter.'}],
'times9-11':[
 {t:'multiple',d:'What you get by multiplying a number by 1, 2, 3, and so on. The multiples of 9 are 9, 18, 27, … — and every one of them is a multiple of 10 minus something.'},
 {t:'carry',d:'When a column passes 9, the extra moves one place left. In 78 × 11 the digit sum 7 + 8 = 15 spills over: the answer is 858, not 7-15-8.'},
 {t:'expanding',d:'Rewriting a number as round-plus-small pieces: 9 = 10 − 1, 11 = 10 + 1. Expanding one factor is what turns ×9 and ×11 into a shift and one addition.'}],
'double-half':[
 {t:'even number',d:'A number that splits into two equal whole halves — it ends in 0, 2, 4, 6, or 8. Halving only stays whole while the factor is even, so evenness is the fuel of this trick.'},
 {t:'power of 2',d:'A number built only from doublings: 2, 4, 8, 16, 32… A power-of-2 factor melts away completely under repeated halving — the ideal case.'},
 {t:'conserved',d:'Something that stays the same while other things change. Trading a ×2 between the factors reshapes the multiplication, but the product is conserved — that is the whole guarantee.'}],
'distribute':[
 {t:'distributive property',d:'Multiplication spreads over addition: a × (b + c) = a×b + a×c. Seven rows of 98 is seven rows of 100 minus seven rows of 2 — the property drawn as a picture.'},
 {t:'expression',d:'A math phrase, like 7 × 98. Mental math is largely the art of rewriting an expression into an easier one that is worth exactly the same.'},

  Voice.stop();
  sess={mode,idx:0,correct:0,wrong:0,times:[],events:[],buf:'',lock:false,queue:null,log:[],
        skillPool:opts.skills||activeSkills(),lives:MODES.survival.lives,started:Date.now(),
        qStart:0,deadline:0,qLimit:0,lesson:opts.lesson||null,over:false};
  if(mode==='check')sess.chk={i:0,qn:0,cur:Math.max(3,S.skills[SKILL_IDS[0]].lv),place:{}};
  if(mode==='daily'){
    const rng=mulberry(dateSeed('reckon-'+todayKey()));
    sess.queue=[];
    const order=SKILL_IDS.slice();
    for(let i=order.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    order.forEach(id=>sess.queue.push(makeQ(id,S.skills[id].lv,rng)));
    for(let i=0;i<2;i++){const id=pick(rng,SKILL_IDS);sess.queue.push(makeQ(id,S.skills[id].lv,rng));}
  }
  if(mode==='review')sess.queue=revQ;
  if(mode==='drill'){
    sess.queue=[];
    for(let i=0;i<5;i++)sess.queue.push(makeQ(opts.skill,opts.lv,Math.random));
  }
  if(mode==='unit'){sess.unit=opts.band;sess.queue=buildUnitTest(opts.band);}
  if(mode==='ltest'){sess.ltest={skill:opts.skill,lv:opts.lv};sess.queue=buildLevelTest(opts.skill,opts.lv);}
  if(mode==='sat')sess.queue=Array.from({length:MODES.sat.len},makeSAT);
  if(mode==='gre')sess.queue=Array.from({length:MODES.gre.len},makeGRE);
  if(mode==='assess'){sess.skillPool=SKILL_IDS.slice();sess.adap={off:0};}
  if(MODES[mode]&&MODES[mode].time){sess.totalMs=MODES[mode].time*1000;sess.deadline=Date.now()+sess.totalMs;}
  loadQ();
  render();
  startTick();
}
function buildReview(now){ // due items rebuilt from their stored operands; an item that can't be rebuilt is let go
  const qs=[];
  rqDue(S.rq||[],now).slice(0,RQ_ROUND).forEach(it=>{
    const qq=rebuildQ(it.s,it.lv,it.d),k=rqKey(it.s,it.d);
    if(qq){qq.rk=k;qs.push(qq);}else S.rq=S.rq.filter(x=>rqKey(x.s,x.d)!==k);
  });
  return qs;
}
function noteMiss(mode,q,ok,now){ // true when the queue changed: a review answer reschedules, a fresh miss enqueues
  if(mode==='review'&&q.rk){S.rq=rqAnswer(S.rq||[],q.rk,ok,now);return true;}
  if(ok||q.choice||!q.d||!RQ_MODES.includes(mode))return false;
  S.rq=rqAdd(S.rq||[],{s:q.skill,lv:q.lv,d:q.d},now);return true;
}
function holdAfterAnswer(mode,ok,hasNote){ // feedback stays until Next everywhere except the racing modes
  return !['sprint','survival','tf'].includes(mode)&&(!ok||!!hasNote);
}
function advanceQ(){
  if(!sess||sess.over)return;
  sess.hold=false;
  sess.idx++;
  if(sess.mode==='survival'&&sess.lives<=0){endSession();return;}
  if(sess.mode==='check'&&sess.chk.i>=SKILL_IDS.length){endSession();return;}
  if(sess.queue&&sess.idx>=sess.queue.length){endSession();return;}
  if((sess.mode==='practice'||sess.mode==='trick'||sess.mode==='assess')&&sess.idx>=MODES[sess.mode].len){endSession();return;}
  if(sess.deadline&&Date.now()>=sess.deadline){endSession();return;}
  loadQ();renderQuiz();
}
function showNext(){
  sess.hold=true;
  const row=$('#nextRow');if(row)row.classList.remove('hide');
  // focus stays on the quiz container — the document keydown handler owns Enter,
  // and focusing the button would make Enter fire twice (native click + handler)
}
function qLimitFor(q){ // survival per-question seconds
  const base=Math.max(5,15-q.lv);
  const speedup=Math.max(.55,1-(sess.correct+sess.wrong)*.015);
  return base*speedup*1000;
}
function loadQ(){
  sess.q=nextQuestion();
  if(!sess.q){endSession();return;}
  sess.buf='';sess.lock=false;sess.qStart=Date.now();
  if(sess.mode==='survival')sess.qLimit=qLimitFor(sess.q);
}
function submit(){
  if(!sess||sess.lock||sess.over)return;
  if(sess.buf===''||sess.buf==='-')return;
  const val=parseInt(sess.buf,10);
  const q=sess.q;
  const ok=q.tol>0?Math.abs(val-q.answer)<=q.tol*Math.abs(q.answer):val===q.answer;
  resolveAnswer(val,ok,false);
}
function giveUp(){
  if(!sess||sess.lock||sess.over)return;
  if(sess.q.choice){submitChoice(-1);return;}
  resolveAnswer(null,false,true);
}
function resolveAnswer(val,ok,gaveUp){
  const ms=Date.now()-sess.qStart;
  const q=sess.q;
  sess.lock=true;
  sess.times.push(ms);
  if(ok)sess.correct++;else sess.wrong++;
  const hx={m:sess.mode,d:q.d,g:gaveUp?null:val};
  const queued=noteMiss(sess.mode,q,ok,Date.now());
  if(['practice','sprint','survival','daily','assess'].includes(sess.mode)){const ev=applyResult(q.skill,ok,ms,q.lv,hx);sess.events.push(...ev);saveState();}
  else if(sess.mode!=='drill'){recordAnswer(q.skill,ok,ms,q.lv,hx);saveState();}
  else if(queued)saveState();
  if(!ok&&sess.mode==='survival')sess.lives--;
  sess.log.push({q,given:val,ok,ms,gaveUp:gaveUp?1:0});
  if(sess.mode==='assess')sess.adap.off=Math.max(-3,Math.min(8,sess.adap.off+(ok?(ms<6000?1:0):-1)));
  if(sess.mode==='check'){
    const c=sess.chk;
    c.cur=Math.max(1,Math.min(12,c.cur+(ok?(ms<6000?2:1):-2)));
    c.qn++;
    if(c.qn>=3){c.place[SKILL_IDS[c.i]]=c.cur;c.i++;c.qn=0;
      if(c.i<SKILL_IDS.length)c.cur=Math.max(3,S.skills[SKILL_IDS[c.i]].lv);}
  }
  SFX.play(ok?'ok':'no');
  const note=!ok?explain(q):null;
  const ansEl=$('#ansLine'),fb=$('#fbLine');
  if(ansEl){ansEl.classList.add(ok?'ok':'no');ansEl.innerHTML=val===null?'&mdash;':esc(fmt(val));}
  if(fb){fb.className='feedback '+(ok?'ok':'no');
    fb.innerHTML=ok?(q.tol>0&&val!==q.answer?`Close enough — exactly ${fmt(q.answer)}`:pick(Math.random,['Correct','Nice','Got it','Clean','Sharp']))
                   :`${gaveUp?'No sweat — the answer is':'Answer:'} ${fmt(q.answer)}`+(note&&sess.mode!=='survival'?`<div class="fbnote">${note.note}</div>`:'');}
  if(Voice.on){
    if(ok)Voice.speak(q.tol>0&&val!==q.answer?`Close enough. Exactly ${speakable(String(q.answer))}.`:pick(Math.random,['Correct.','Nice.','Got it.','Clean.']));
    else Voice.speak(`Not quite. The answer is ${speakable(String(q.answer))}. `+(note&&sess.mode!=='survival'?speakable(note.note):''));
  }
  if(holdAfterAnswer(sess.mode,ok,note)){showNext();return;}
  const wait=ok?600:(note&&sess.mode!=='survival'?(Voice.on?5200:2800):1400);
  setTimeout(advanceQ,wait);
}
function timeoutQ(){ // survival clock ran out
  if(!sess||sess.lock)return;
  sess.lock=true;sess.wrong++;sess.lives--;
  const q=sess.q;
  sess.log.push({q,given:null,ok:false,ms:sess.qLimit});
  noteMiss(sess.mode,q,false,Date.now());
  if(sess.mode!=='drill'&&sess.mode!=='check'){const ev=applyResult(q.skill,false,sess.qLimit,q.lv,{m:sess.mode,d:q.d,g:null});sess.events.push(...ev);saveState();}
  const fb=$('#fbLine');
  if(fb){fb.className='feedback no';fb.textContent=`Time — answer: ${fmt(q.answer)}`;}
  setTimeout(()=>{if(!sess)return;
    if(sess.lives<=0){endSession();return;}
    sess.idx++;loadQ();renderQuiz();},1400);
}
function endSession(){
  stopTick();
  const done=sess;done.over=true;
  if(done.mode==='sprint'&&done.correct>S.bestSprint){S.bestSprint=done.correct;done.newBest=true;}
  if(done.mode==='survival'&&done.correct>S.bestSurvival){S.bestSurvival=done.correct;done.newBest=true;}
  if(done.mode==='tf'&&done.correct>(S.bestTF||0)){S.bestTF=done.correct;done.newBest=true;}
  if(done.mode==='daily')S.daily[todayKey()]={score:done.correct,total:done.queue.length}; // an abandoned daily still counts out of ten
  if(done.mode==='drill'&&done.lesson&&done.correct>=4)S.lessons[done.lesson]={c:1,m:1};
  if(done.mode==='check'&&done.chk&&Object.keys(done.chk.place).length===SKILL_IDS.length){
    done.chk.measured=done.chk.place;
    const ap=applyPlacement(done.chk.place);
    done.chk.place=ap.place;done.chk.capped=ap.capped;
    S.lastCheck=todayKey();
  }
  if(done.mode==='ltest'&&done.ltest){
    const r=applyLevelTest(done.ltest.skill,done.ltest.lv,done.correct);
    done.ltPassed=r.passed;done.ltUnlocked=r.unlocked;
  }
  if(done.mode==='unit'&&done.queue){
    const total=done.queue.length,pct=total?done.correct/total:0;
    const prev=S.units[done.unit]||{};
    done.unitPassed=pct>=.8;
    done.newUnlock=done.unitPassed&&!prev.passed&&done.unit<3;
    S.units[done.unit]={passed:prev.passed||done.unitPassed,best:Math.max(prev.best||0,Math.round(pct*100)),date:todayKey()};
  }
  if(done.mode==='sat'){const sc=200+60*done.correct;const p=S.tests.sat||{};S.tests.sat={last:sc,best:Math.max(p.best||0,sc),date:todayKey()};done.styled=sc;}
  if(done.mode==='gre'){const sc=130+4*done.correct;const p=S.tests.gre||{};S.tests.gre={last:sc,best:Math.max(p.best||0,sc),date:todayKey()};done.styled=sc;}
  if(done.mode==='assess'&&done.log.length){
    const oks=done.log.filter(l=>l.ok);
    const dAvg=oks.length?oks.reduce((a,l)=>a+l.q.lv,0)/oks.length:1;
    const accA=oks.length/done.log.length;
    const spd=done.times.length?done.times.reduce((a,b)=>a+b,0)/done.times.length/1000:8;
    const rA=ratingFrom(dAvg,accA,spd);
    done.dLvl=dAvg;
    done.maxLv=oks.length?Math.max(...oks.map(l=>l.q.lv)):1;
    done.rating=Math.round((ratingNow()+rA)/2/5)*5;
    done.rated=ratingReady(); // an assessment abandoned after a few answers rates nothing
    const last=S.rhist[S.rhist.length-1];
    if(done.rated&&(!last||last.r!==done.rating))S.rhist.push({t:Date.now(),r:done.rating});
    if(S.rhist.length>240)S.rhist=S.rhist.slice(-200);
  }else{
    done.rating=pushRating();
  }
  if(done.mode==='assess'&&done.rated)S.tests.assess={rating:done.rating,date:todayKey(),acc:done.correct+'/'+(done.correct+done.wrong)};
  saveState();
  renderHeader();render();
}
function quitSession(){stopTick();Voice.stop();sess=null;render();}
function leaveSession(viaEsc){ // a started Daily Ten can't be abandoned and replayed — leaving it ends it
  if(!sess||sess.over)return;
  if(sess.mode==='daily'?sess.log.length>0:(!viaEsc&&sess.idx>0))endSession();else quitSession();
}
function startTick(){
  stopTick();
  tickHandle=setInterval(()=>{
    if(!sess||sess.over)return;
    if(sess.deadline){
      const left=sess.deadline-Date.now();
      if(left<=0&&!sess.lock){endSession();return;}
      updateTimerBar(left/sess.totalMs,left);
    }else if(sess.mode==='survival'&&!sess.lock){
      const left=sess.qLimit-(Date.now()-sess.qStart);
      if(left<=0){timeoutQ();return;}
      updateTimerBar(left/sess.qLimit,left);
    }
  },100);
}
function stopTick(){if(tickHandle){clearInterval(tickHandle);tickHandle=null;}}
function updateTimerBar(frac,leftMs){
  const bar=$('#timerFill');if(!bar)return;
  bar.style.width=(Math.max(0,frac)*100)+'%';
  bar.classList.toggle('low',frac<.25);
  const lbl=$('#timeLbl');if(lbl)lbl.textContent=(leftMs/1000).toFixed(1)+'s';
}

function ratingChart(){
  const pts=S.rhist.slice(-60).map(h=>h.r);
  if(pts.length<2)return '<div class="empty">Finish a few rounds — your rating trend will draw itself here.</div>';
  const W=560,H=130,P=10;
  const max=Math.max(...pts),min=Math.min(...pts);
  const x=i=>P+i*(W-2*P)/(pts.length-1);
  const y=v=>H-P-((v-min)/(max-min||1))*(H-2*P);
  const line=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Rating trend">
    <path d="${line} L${x(pts.length-1).toFixed(1)} ${H-P} L${x(0).toFixed(1)} ${H-P} Z" fill="var(--accent-soft)"></path>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1]).toFixed(1)}" r="4" fill="var(--accent)"></circle>
   </svg>`;
}

function submitChoice(idx){
  if(!sess||sess.lock||sess.over||!sess.q.choice)return;
  const q=sess.q,ms=Date.now()-sess.qStart,ok=idx===q.correct,gaveUp=idx<0;
  sess.lock=true;sess.times.push(ms);
  if(ok)sess.correct++;else sess.wrong++;
  recordAnswer(q.skill,ok,ms,q.lv,{m:sess.mode,d:q.d,g:gaveUp?null:idx});saveState();
  sess.log.push({q,given:gaveUp?null:idx,ok,ms,gaveUp:gaveUp?1:0});
  SFX.play(ok?'ok':'no');
  const box=$('#choiceBox');
  if(box){
    box.querySelectorAll('button').forEach((b,i)=>{
      b.disabled=true;
      if(i===idx)b.classList.add(ok?'right':'wrongpick');
      if(!ok&&i===q.correct)b.classList.add('reveal');
    });
  }
  const fb=$('#fbLine');
  if(fb){fb.className='feedback '+(ok?'ok':'no');
    fb.innerHTML=(ok?pick(Math.random,['Right','Exactly','That\'s the one']):gaveUp?'No sweat — it\'s the highlighted one':'Not this time')+(q.note?`<div class="fbnote">${q.note}</div>`:'');}
  if(Voice.on)Voice.speak((ok?'Right. ':'Not quite. ')+(q.note?speakable(q.note):''));
  if(holdAfterAnswer(sess.mode,ok,q.note)){showNext();return;}
  const wait=ok?(sess.mode==='tf'?650:1500):(Voice.on?5200:sess.mode==='tf'?1900:3000);
  setTimeout(advanceQ,wait);
}
function drawBuf(){
  const el=$('#ansLine');if(!el||!sess||sess.lock)return;
  el.className='answer';
  el.innerHTML=(sess.buf===''?'':esc(sess.buf.replace(/\B(?=(\d{3})+(?!\d))/g,',')))+'<span class="caret"></span>';
}
function key(k){
  if(!sess||sess.over||sess.lock)return;
  if(k==='go'){submit();return;}
  if(k==='del'){sess.buf=sess.buf.slice(0,-1);}
  else if(k==='neg'){sess.buf=sess.buf.startsWith('-')?sess.buf.slice(1):'-'+sess.buf;}
  else if(/^\d$/.test(k)&&sess.buf.replace('-','').length<9){sess.buf+=k;}
  drawBuf();
}
function typingTarget(t){return !!t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'')||!!t.isContentEditable);}
function onKey(e){
  if(!sess||sess.over)return;
  if(typingTarget(e.target))return; // typing a name or an idea is not answering a question
  if(sess.hold){
    if(e.key==='Enter'||e.key===' '){advanceQ();e.preventDefault();}
    else if(e.key==='Escape')leaveSession(true);
    return;
  }
  if(sess.q&&sess.q.choice){
    if(sess.q.wide&&/^[tf]$/i.test(e.key)){submitChoice(e.key.toLowerCase()==='t'?0:1);e.preventDefault();}
    else if(e.key>='1'&&e.key<=String(sess.q.choices.length)){submitChoice(+e.key-1);e.preventDefault();}
    else if(e.key==='Escape')leaveSession(true);
    return;
  }
  if(e.key>='0'&&e.key<='9'){key(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){key('del');e.preventDefault();}
  else if(e.key==='-'){key('neg');e.preventDefault();}
  else if(e.key==='Enter'){key('go');e.preventDefault();}
  else if(e.key==='Escape'){leaveSession(true);}
}

function roundRecos(d){ // what this round says to study next: lessons behind the misses + weakest skills
  const lessons=[],skills={},seen=new Set();
  (d.log||[]).forEach(l=>{
    const slow=!l.q.choice&&l.ok&&l.ms>10000;
    if(l.ok&&!slow)return;
    if(!l.ok)skills[l.q.skill]=(skills[l.q.skill]||0)+1;
    const les=l.q.choice?l.q.lessonId:(explain(l.q)||{}).lesson;
    if(!les||seen.has(les))return;
    if(LESSONS.some(x=>x.id===les)){seen.add(les);lessons.push(les);} // coach links open lessons directly, like the review rows — unit locks gate browsing, not coaching
  });
  const weak=Object.keys(skills).sort((a,b)=>skills[b]-skills[a]);
  return {lessons:lessons.slice(0,2),skills:weak.slice(0,2)};
}
function coachRoundLine(d,acc,avg){
  const misses=d.log.filter(l=>!l.ok).length;
  const slow=d.log.filter(l=>l.ok&&l.ms>10000).length;

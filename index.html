  if(acc===100&&avg&&avg<4)return 'Flawless and fast. No notes — I\'m raising the bar next round.';
  if(acc===100&&slow)return `Perfect accuracy, but ${slow} answer${slow>1?'s':''} took over 10 seconds. The review below shows the shortcut you were grinding past.`;
  if(acc===100)return 'Clean sheet. When that feels routine, add a skill or try Sprint.';
  if(acc>=85)return `Strong round. The ${misses} you missed ${misses>1?'are':'is'} annotated below — each one had a faster route.`;
  if(acc>=60)return `Honest read: ${misses} misses is a technique gap, not bad luck. Walk the review — the same tricks keep applying.`;
  return 'Straight talk: you\'re answering faster than you can compute. Slow down, use the methods in the review, and the speed will come back honest.';
}

function lastNDays(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    out.push({k,label:d.toLocaleDateString('en-US',{weekday:'narrow'}),n:S.days[k]||0});
  }
  return out;
}
function sparkline(){
  const pts=S.hist.slice(-60).map(h=>h.ms/1000);
  if(pts.length<5)return '<div class="empty">Answer a few more questions to see your speed trend.</div>';
  const W=560,H=120,P=8;
  const max=Math.max(...pts,1),min=Math.min(...pts);
  const x=i=>P+i*(W-2*P)/(pts.length-1);
  const y=v=>H-P-((v-min)/(max-min||1))*(H-2*P);
  const line=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-P} L${x(0).toFixed(1)} ${H-P} Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Response time, last ${pts.length} answers">
    <path d="${area}" fill="var(--accent-soft)"></path>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" fill="var(--accent)"><title>${last.toFixed(1)}s latest</title></circle>
    <text x="${W-P}" y="${Math.max(14,y(last)-10)}" text-anchor="end" class="num" font-size="12" fill="var(--muted)">${last.toFixed(1)}s</text>
   </svg>`;
}
function dayBars(){
  const days=lastNDays(14);
  const max=Math.max(...days.map(d=>d.n),1);
  const W=560,H=110,P=4,bw=(W-2*P)/14;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Questions answered per day, last 14 days">
   ${days.map((d,i)=>{
     const h=d.n?Math.max(4,(d.n/max)*(H-30)):2;
     const xx=P+i*bw+3,ww=bw-6,yy=H-18-h;
     return `<g><rect x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="${ww.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${d.n?'var(--accent)':'var(--line2)'}"><title>${d.k}: ${d.n} answered</title></rect>
       <text x="${(xx+ww/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--faint)">${d.label}</text></g>`;
   }).join('')}
  </svg>`;
}

function studyImpact(){ // accuracy on a lesson's skill before vs after first studying it — only with ≥8 answers each side
  const out=[];
  Object.keys(S.study).forEach(id=>{
    const les=LESSONS.find(l=>l.id===id);if(!les)return;
    const first=S.study[id].first;
    const all=S.hist.filter(h=>h.s===les.skill);
    const before=all.filter(h=>h.t<first).slice(-20),after=all.filter(h=>h.t>=first);
    if(before.length<8||after.length<8)return;
    const ba=before.filter(h=>h.ok).length/before.length,aa=after.filter(h=>h.ok).length/after.length;
    out.push({id,title:les.title,skill:les.skill,before:ba,after:aa,nb:before.length,na:after.length,delta:aa-ba});
  });
  return out.sort((a,b)=>b.delta-a.delta);
}
function skillTrend(id){ // last 15 answers vs the 15 before — needs 30 in that skill
  const all=S.hist.filter(h=>h.s===id);
  if(all.length<30)return null;
  const recent=all.slice(-15),prior=all.slice(-30,-15);
  const ra=recent.filter(h=>h.ok).length/15,pa=prior.filter(h=>h.ok).length/15;
  return {recent:ra,prior:pa,delta:ra-pa};
}

  if(spread>=3)notes.push({t:`${SKILLS[lo].name} (L${S.skills[lo].lv}) sits ${spread} levels behind ${SKILLS[hi].name.toLowerCase()} (L${S.skills[hi].lv}). No way around it: that's the bottleneck, and mixed rounds will keep exposing it until we fix it.`});
  if(recent.length>=20&&acc<.75)notes.push({t:`Last ${recent.length} answers: ${Math.round(acc*100)}% correct. You're answering faster than you're computing. Accuracy first — speed is a byproduct of technique, not of hurrying.`});
  if(recent.length>=20&&acc>=.93&&avg>9)notes.push({t:`${Math.round(acc*100)}% accurate but ${avg.toFixed(1)}s per answer — careful, but you're grinding digit-by-digit. The shortcuts in Learn exist to kill exactly that. Then Sprint to force tempo.`});
  const active7=lastNDays(7).filter(x=>x.n>0).length;
  if(S.totals.n>=30&&active7<=2)notes.push({t:`${active7} active day${active7===1?'':'s'} in the last week. Being honest: automaticity is built daily. Ten minutes a day beats an hour on Sunday.`});

  if(!notes.length)notes.push({t:'Profile looks balanced and your pace is honest. Keep stacking rounds — I\'ll flag the moment something drifts.'});

}
function coachPlan(){

  const stale=S.lastCheck&&((Date.now()-new Date(S.lastCheck+'T12:00:00').getTime())/86400000>=14);
  if(!S.lastCheck)items.push({label:'Skill Check — calibrate all eight skills (3 min)',act:'check'});
  if(wl)items.push({label:`Learn & drill “${wl.title}” — it targets your ${SKILLS[wl.skill].name.toLowerCase()}`,act:'lesson',id:wl.id});
  const ready=SKILL_IDS.find(id=>lad(id).placed&&S.skills[id].lv===lad(id).unlocked&&S.skills[id].lv<12&&ladderReady(id).ready);
  if(ready)items.push({label:`${SKILLS[ready].name} Level ${S.skills[ready].lv} test — your recent form says you're ready`,act:'ltest',skill:ready});

  if(STORE.status==='quarantined')return STORE.readOnly

    :'Your saved progress could not be read, so it was set aside untouched instead of being overwritten. Restore a snapshot on Profile, or copy the set-aside data from there.';
  if(STORE.readOnly)return 'Storage is full: Reckon could not back up your progress before updating it, so nothing is being saved this visit and the original is untouched.';
  if(!persistOK)return 'Heads up: this browser is blocking storage or it is full, so progress lasts only for this visit.';

function adoptState(text,why){

    $('#impFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
      const rd=new FileReader();rd.onload=()=>{txt.value=String(rd.result||'');armed=false;$('#impCheck').textContent='Check it';};rd.readAsText(f);});
    txt.addEventListener('input',()=>{armed=false;$('#impCheck').textContent='Check it';});
    $('#impCheck').addEventListener('click',()=>{
      if(!armed){const r=STORE.readOnly?adoptState(txt.value):importBundle(txt.value);
        if(!r.ok){msg.textContent=r.errors.join(' ');return;}
        msg.textContent=`Valid: ${stateSummary(r.state)}${r.exported?' · exported '+new Date(r.exported).toLocaleString():''}. It will replace ${fmt(S.totals.n)} answers here.`;
        armed=true;$('#impCheck').textContent='Replace my progress';return;}
      const r=adoptState(txt.value,'before import');
      if(!r.ok){msg.textContent=r.errors.join(' ');return;}
      toast('Progress imported');
    });
  });
  const qb=$('#quarGo');
  if(qb)qb.addEventListener('click',()=>{const q=readList(localStorage,QUAR_KEY),last=q[q.length-1];
    open(`Set aside ${new Date(last.t).toLocaleString()} because: ${last.why}. This is the raw data, untouched — copy it somewhere safe. If it can be repaired into valid JSON, Import progress will take it.`,
      last.raw,[['dataCopy','Copy']]);
    $('#dataCopy').addEventListener('click',copy);});
  v.querySelectorAll('[data-snap]').forEach(b=>b.addEventListener('click',()=>{
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Confirm restore';return;}
    const x=readList(localStorage,SNAP_KEY)[+b.dataset.snap];
    const r=x?adoptState(x.json,'before restore'):{ok:false,errors:['That snapshot is gone.']};
    if(r.ok)toast('Snapshot restored');else{b.textContent='Restore';delete b.dataset.armed;toast(r.errors[0]);}
  }));
}
/* ================= boot ================= */
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
Voice.on=Voice.ready&&!!S.voiceOn;
renderVoiceBtn();
const vb=$('#voiceBtn');if(vb&&Voice.ready)vb.addEventListener('click',()=>Voice.toggle());
SFX.on=S.sfxOn!==false;
renderSfxBtn();
const sb=$('#sfxBtn');if(sb)sb.addEventListener('click',()=>SFX.toggle());
document.querySelectorAll('.tabs button').forEach(b=>{
  const ic=TAB_ICONS[b.dataset.tab];
  if(ic)b.insertAdjacentHTML('afterbegin',`<span class="ti">${ic}</span>`);
});
const cr=$('#chipRank');if(cr){cr.style.cursor='pointer';cr.title='Open your profile';cr.addEventListener('click',()=>switchTab('profile'));}
render();
ideasInit();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
